<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Chat</title>

    <link rel="stylesheet" href="./css/chat.css">
</head>

<body>

    <!-- Real-time connection status banner -->
    <div id="connection-banner" class="connection-banner" hidden></div>

    <main class="chat-layout">

        <!-- ==================== SIDEBAR ==================== -->

        <aside class="sidebar">

            <!-- User Profile -->
            <div class="profile">

                <div
                    class="profile-avatar"
                    id="profile-avatar"
                ></div>

                <div class="profile-info">

                    <h3 id="profile-name"></h3>

                    <span>Online</span>

                </div>

                <button id="logout-btn" class="logout-btn" title="Log Out">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>

            </div>


            <!-- Search -->
            <div class="chat-search">

                <input
                    type="text"
                    placeholder="Search chats..."
                    autocomplete="off"
                >

            </div>


            <!-- Groups -->

            <div class="groups">

                <div class="groups-header">
                    <span>Groups</span>

                    <button
                        id="create-group-btn"
                        class="create-group-btn"
                        title="Create Group"
                    >
                        +
                    </button>
                </div>

                <div
                    class="group-list"
                    id="group-list"
                ></div>

            </div>


            <!-- Users -->

            <div class="users">

                <div class="users-header">
                    <span>People</span>
                </div>

                <div
                    class="user-list"
                    id="user-list"
                ></div>

            </div>

            <div
        class="modal-overlay"
        id="create-group-modal"
    >
        <div class="modal">
                    <div class="modal-header">
                        <h3>Create New Group</h3>

                        <button
                            id="close-create-group-modal"
                            class="modal-close"
                        >
                            ×
                        </button>
                    </div>

                    <form id="create-group-form">

                        <label for="group-name">
                            Group Name
                        </label>

                        <input
                            type="text"
                            id="group-name"
                            placeholder="Enter group name"
                            maxlength="50"
                            required
                        />

                        <p
                            id="create-group-error"
                            class="form-error"
                        ></p>

                        <button
                            type="submit"
                            class="create-group-submit"
                        >
                            Create Group
                        </button>

                    </form>
                </div>
            </div>

            <div
                class="modal-overlay"
                id="group-info-modal"
            >
                <div class="modal group-info-modal">

                    <div class="modal-header">
                        <div>
                            <h3 id="group-info-name">
                                Group Info
                            </h3>

                            <p id="group-member-count">
                                0 members
                            </p>
                        </div>

                        <button
                            id="close-group-info-modal"
                            class="modal-close"
                        >
                            ×
                        </button>
                    </div>

                    <div
                        id="group-member-list"
                        class="group-member-list"
                    >
                    </div>

                    <button
                        id="add-members-btn"
                        class="create-group-submit"
                    >
                        + Add Members
                    </button>

                    <button
                        id="leave-group-btn"
                        class="leave-group-btn"
                    >
                        Leave Group
                    </button>

                </div>
            </div>
           
            <div
                class="modal-overlay"
                id="add-members-modal"
            >
                <div class="modal">

                    <div class="modal-header">
                        <h3>Add Members</h3>

                        <button
                            id="close-add-members-modal"
                            class="modal-close"
                        >
                            ×
                        </button>
                    </div>

                    <div
                        id="available-users-list"
                        class="available-users-list"
                    >
                    </div>

                    <p
                        id="add-members-error"
                        class="form-error"
                    ></p>

                    <button
                        id="confirm-add-members-btn"
                        class="create-group-submit"
                    >
                        Add Selected
                    </button>

                </div>
            </div>

        </aside>


        <!-- ==================== CHAT SECTION ==================== -->

        <section class="chat-section">


            <!-- Chat Header -->

            <header class="chat-header">

                <div class="chat-header-info">

                    <div
                        class="chat-header-avatar"
                        id="chat-header-avatar"
                    ></div>

                    <div>

                        <h2 id="chat-header"></h2>

                        <span id="chat-member-count">
                            <!-- Populated dynamically -->
                        </span>

                    </div>

                </div>


                <div class="chat-header-actions">

                    <button
                        class="header-action"
                        title="Search"
                        type="button"
                    >
                        🔍
                    </button>

                    <button
                    id="group-info-btn"
                    class="group-info-btn"
                    title="Group Info"
                >
                    ⓘ
                </button>

                </div>

            </header>


            <!-- ==================== CHAT MESSAGES ==================== -->

            <!--
                Messages are loaded dynamically by chat.js
                from the backend API.
            -->

            <section
                class="chat-messages"
                id="chat-messages"
            ></section>


            <!-- ==================== MESSAGE INPUT ==================== -->

            <footer class="chat-input">

                <button
                    class="input-action"
                    title="Emoji"
                    type="button"
                >
                    😊
                </button>


                <button
                    id="attach-file-btn"
                    class="input-action"
                    title="Attach file"
                    type="button"
                >
                    📎
                </button>

                <input
                    type="file"
                    id="file-input"
                    hidden
                >
                
                <div
                    id="ai-smart-replies"
                    class="ai-smart-replies"
                ></div>

                <div
                    id="ai-typing-suggestions"
                    class="ai-typing-suggestions"
                ></div>


                <input
                    type="text"
                    id="message-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                >


                <button
                    class="send-button"
                    type="button"
                >
                    Send
                </button>

                <div
                    id="attachment-preview"
                    class="attachment-preview"
                    hidden
                ></div>

            </footer>

        </section>

    </main>


    <!--
        api.js must load before chat.js
        because chat.js uses API_BASE_URL.
    -->

    <script src="./js/api.js"></script>

    <!-- Socket.IO client -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <!-- Chat application logic as ES module -->
    <script type="module" src="./js/chat.js"></script>

</body>

</html>
