<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Chat</title>

    <link rel="stylesheet" href="./css/chat.css">
</head>

<body>

    <main class="chat-layout">

        <!-- ==================== SIDEBAR ==================== -->

        <aside class="sidebar">

            <!-- User Profile -->
            <div class="profile">

                <div class="profile-avatar">
                    S
                </div>

                <div class="profile-info">
                    <h3>Shivam</h3>
                    <span>Online</span>
                </div>

            </div>


            <!-- Search -->
            <div class="chat-search">

                <input
                    type="text"
                    placeholder="Search chats..."
                >

            </div>


            <!-- Groups -->
            <div class="groups">

                <div class="groups-header">
                    <span>Groups</span>
                </div>


                <!-- ==================== GROUP 1 ==================== -->

                <div
                    class="group-item active"
                    data-group-id="1"
                >

                    <div class="group-avatar">
                        D
                    </div>

                    <div class="group-info">

                        <div class="group-top">

                            <h4>Developers</h4>

                            <span class="group-time">
                                11:45
                            </span>

                        </div>

                        <div class="group-bottom">

                            <p>
                                Yes! Authentication is already working.
                            </p>

                            <span class="unread-count">
                                2
                            </span>

                        </div>

                    </div>

                </div>


                <!-- ==================== GROUP 2 ==================== -->

                <div
                    class="group-item"
                    data-group-id="2"
                >

                    <div class="group-avatar">
                        F
                    </div>

                    <div class="group-info">

                        <div class="group-top">

                            <h4>Friends</h4>

                            <span class="group-time">
                                10:30
                            </span>

                        </div>

                        <div class="group-bottom">

                            <p>
                                See you later!
                            </p>

                        </div>

                    </div>

                </div>


                <!-- ==================== GROUP 3 ==================== -->

                <div
                    class="group-item"
                    data-group-id="3"
                >

                    <div class="group-avatar">
                        C
                    </div>

                    <div class="group-info">

                        <div class="group-top">

                            <h4>College</h4>

                            <span class="group-time">
                                Yesterday
                            </span>

                        </div>

                        <div class="group-bottom">

                            <p>
                                Meeting at 5 PM.
                            </p>

                            <span class="unread-count">
                                4
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </aside>


        <!-- ==================== CHAT SECTION ==================== -->

        <section class="chat-section">


            <!-- Chat Header -->

            <header class="chat-header">

                <div class="chat-header-info">

                    <div class="chat-header-avatar">
                        D
                    </div>

                    <div>

                        <h2>
                            Full Stack Developers
                        </h2>

                        <span>
                            12 members
                        </span>

                    </div>

                </div>


                <div class="chat-header-actions">

                    <button
                        class="header-action"
                        title="Search"
                        type="button"
                    >
                        🔍
                    </button>

                    <button
                        class="header-action"
                        title="More"
                        type="button"
                    >
                        ⋮
                    </button>

                </div>

            </header>


            <!-- ==================== CHAT MESSAGES ==================== -->

            <!--
                Messages are loaded dynamically by chat.js
                from the backend API.

                Do NOT put hardcoded messages here.
            -->

            <section class="chat-messages"></section>


            <!-- ==================== MESSAGE INPUT ==================== -->

            <footer class="chat-input">

                <button
                    class="input-action"
                    title="Emoji"
                    type="button"
                >
                    😊
                </button>


                <button
                    class="input-action"
                    title="Attach file"
                    type="button"
                >
                    📎
                </button>


                <input
                    type="text"
                    placeholder="Type a message..."
                    autocomplete="off"
                >


                <button
                    class="send-button"
                    type="button"
                >
                    Send
                </button>

            </footer>

        </section>

    </main>


    <!--
        api.js must load before chat.js
        because chat.js uses API_BASE_URL.
    -->

    <script src="./js/api.js"></script>
    <script src="./js/chat.js"></script>

</body>

</html>
