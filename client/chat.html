<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Chat</title>

    <link rel="stylesheet" href="./css/chat.css">
</head>

<body>

    <main class="chat-layout">

        <!-- ==================== SIDEBAR ==================== -->

        <aside class="sidebar">

            <!-- User Profile -->
            <div class="profile">

                <div
                    class="profile-avatar"
                    id="profile-avatar"
                ></div>

                <div class="profile-info">

                    <h3 id="profile-name"></h3>

                    <span>Online</span>

                </div>

            </div>


            <!-- Search -->
            <div class="chat-search">

                <input
                    type="text"
                    placeholder="Search chats..."
                    autocomplete="off"
                >

            </div>


            <!-- Groups -->

            <div class="groups">

                <div class="groups-header">
                    <span>Groups</span>
                </div>

                <div
                    class="group-list"
                    id="group-list"
                ></div>

            </div>


            <!-- Users -->

            <div class="users">

                <div class="users-header">
                    <span>People</span>
                </div>

                <div
                    class="user-list"
                    id="user-list"
                ></div>

            </div>

        </aside>


        <!-- ==================== CHAT SECTION ==================== -->

        <section class="chat-section">


            <!-- Chat Header -->

            <header class="chat-header">

                <div class="chat-header-info">

                    <div
                        class="chat-header-avatar"
                        id="chat-header-avatar"
                    ></div>

                    <div>

                        <h2 id="chat-header"></h2>

                        <span id="chat-member-count">
                            <!-- Populated dynamically -->
                        </span>

                    </div>

                </div>


                <div class="chat-header-actions">

                    <button
                        class="header-action"
                        title="Search"
                        type="button"
                    >
                        🔍
                    </button>

                    <button
                        class="header-action"
                        title="More"
                        type="button"
                    >
                        ⋮
                    </button>

                </div>

            </header>


            <!-- ==================== CHAT MESSAGES ==================== -->

            <!--
                Messages are loaded dynamically by chat.js
                from the backend API.
            -->

            <section
                class="chat-messages"
                id="chat-messages"
            ></section>


            <!-- ==================== MESSAGE INPUT ==================== -->

            <footer class="chat-input">

                <button
                    class="input-action"
                    title="Emoji"
                    type="button"
                >
                    😊
                </button>


                <button
                    class="input-action"
                    title="Attach file"
                    type="button"
                >
                    📎
                </button>


                <input
                    type="text"
                    placeholder="Type a message..."
                    autocomplete="off"
                >


                <button
                    class="send-button"
                    type="button"
                >
                    Send
                </button>

            </footer>

        </section>

    </main>


    <!--
        api.js must load before chat.js
        because chat.js uses API_BASE_URL.
    -->

    <script src="./js/api.js"></script>

    <!-- Socket.IO client -->
    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <!-- Chat application logic -->
    <script src="./js/chat.js"></script>

</body>

</html>
