# ==========================================================
# Nginx Production Reverse Proxy Configuration
# Optimized for: Node.js (PM2), Socket.IO WebSockets & Jenkins
# Location on Ubuntu: /etc/nginx/sites-available/group-chat
# Symlink: sudo ln -sf /etc/nginx/sites-available/group-chat /etc/nginx/sites-enabled/
# ==========================================================

# Upstream pool for PM2 Node.js application
upstream nodejs_app {
    server 127.0.0.1:5000;
    keepalive 64;
}

# Upstream pool for Jenkins CI/CD Controller
upstream jenkins_server {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP Server Block (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _; # Catch-all: works out of the box with EC2 Public IP or any domain

    # Maximum file upload size (accommodates multimedia messages up to 25MB)
    client_max_body_size 30M;

    # Gzip compression for static performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # ------------------------------------------------------------------
    # 1. Socket.IO Real-Time Engine (WebSocket & Long-Polling)
    # ------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://nodejs_app;
        proxy_http_version 1.1;

        # WebSocket Connection Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instantaneous low-latency socket frame delivery
        proxy_buffering off;

        # Persistent connection timeout (24 hours) to prevent socket drops
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ------------------------------------------------------------------
    # 2. Main Web Application & REST APIs
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://nodejs_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------------
    # 3. Jenkins CI/CD Reverse Proxy (Accessible via /jenkins/)
    # ------------------------------------------------------------------
    location /jenkins/ {
        proxy_pass http://jenkins_server;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Jenkins CLI and WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }
}
